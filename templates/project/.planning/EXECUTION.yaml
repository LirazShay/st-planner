version: 1

# Generated only after the complete S&T plan is frozen.
# A populated allocation does NOT authorize execution by itself and does NOT
# activate a numbered executor identity in any conversation.
# Before first authorization:
#   node .planning/validate-allocation.mjs --initial
# must pass. Use --resume after execution/replanning. Add --serial-chats only when
# numbered chats are explicitly serial.
# Then the mandatory repository-only fresh-chat verification in EXECUTOR_HANDOFF.md
# must pass and be recorded in REVIEWS.md.
# Executors may start only when .planning/STATUS.yaml has:
#   cycle_state: active
#   plan_state: frozen
#   implementation_authorized: true
# A completed or abandoned cycle is terminal and can never authorize execution.
#
# Conversation identity is separate from this repository allocation:
# - Chat N becomes active only after an explicit startup in that conversation;
# - repo/current_chat/runnable pointers may confirm but never create/change identity;
# - after a conversation emits SEQUENCE_RUNNER_NEW_CHAT it is execution-closed for
#   later allocated chats, even if the repo advances and the user says continue;
# - apply EXECUTOR_HANDOFF.md / executor-authority.mjs before any execution mutation.
#
# Each implementation-ready leaf must appear exactly once under one numbered chat.
# TREE.yaml remains the planning source.
# depends_on remains only in TREE.yaml.
#
# Execution states:
# - pending: assigned, not started
# - in_progress: currently being executed
# - done: success_evidence verified
# - blocked: execution cannot continue because of a real execution/planning blocker
#
# A temporary external live-verification condition (for example unavailable auth,
# market, hardware, environment, or third-party system) may use blocked after
# implementation + offline/harness proof are complete. In that case result must say
# what passed, what live evidence remains, and the factual availability reason.
# This does not by itself reopen planning or stop unrelated nodes. Only real
# depends_on relationships wait for that leaf to become done.
#
# If blocked because the frozen plan itself is materially wrong/incomplete:
# - keep .planning/STATUS.yaml -> cycle_state: active;
# - set .planning/STATUS.yaml -> plan_state: active;
# - set .planning/STATUS.yaml -> implementation_authorized: false;
# - stop starting new execution work;
# - replan/review the smallest affected S&T area;
# - preserve done nodes only if still valid;
# - re-freeze and repair only affected execution entries.
#
# result:
# - null while pending/in_progress
# - short verification/result reference when done
# - short blocker explanation when blocked

chats: {}

# Example:
#
# chats:
#   "1":
#     nodes:
#       "1.2.1":
#         state: pending
#         result: null
#       "1.2.2":
#         state: pending
#         result: null
#
#   "2":
#     nodes:
#       "1.3.1":
#         state: pending
#         result: null
#
# A fresh conversation explicitly says "I am chat 1" / "אני צאט 1 תתחיל".
# It follows EXECUTOR_HANDOFF.md, then reads only its assigned nodes plus required context.
# Before executing a node, it checks TREE.yaml -> depends_on and confirms every
# prerequisite node is state: done somewhere in this file.

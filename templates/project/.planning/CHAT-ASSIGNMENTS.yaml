version: 1

# Generated only after:
# 1. the complete S&T plan is frozen;
# 2. execution GitHub Issues/tasks have been created.
#
# Purpose:
# A new executor chat can say only "I am chat 1" (or 2, 3, ...)
# and deterministically discover what work to pull from GitHub.
#
# Do not duplicate task details here. GitHub Issues remain the execution source.
# TREE.yaml remains the planning rationale.

assignments: {}

# Example:
#
# assignments:
#   "1":
#     issues:
#       - 101
#       - 102
#     snt_nodes:
#       - "1.2.1"
#       - "1.2.2"
#     depends_on_chats: []
#
#   "2":
#     issues:
#       - 103
#     snt_nodes:
#       - "1.3.1"
#     depends_on_chats:
#       - "1"
#
# Dependency rule:
# A chat dependency is satisfied when all GitHub Issues assigned to that
# prerequisite chat are complete/closed (or otherwise explicitly marked done
# by the project's normal task workflow).

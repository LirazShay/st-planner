version: 1

# Generated only after:
# 1. the complete S&T plan is frozen;
# 2. execution GitHub Issues/tasks have been created.
#
# Purpose:
# A new executor chat can say only "I am chat 1" (or 2, 3, ...)
# and deterministically discover what work to pull from GitHub.
#
# Do not duplicate task details or dependency status here.
# GitHub Issues remain the execution source.
# TREE.yaml remains the planning rationale.

assignments: {}

# Example:
#
# assignments:
#   "1":
#     issues:
#       - 101
#       - 102
#     snt_nodes:
#       - "1.2.1"
#       - "1.2.2"
#
#   "2":
#     issues:
#       - 103
#     snt_nodes:
#       - "1.3.1"
#
# Start rule:
# A chat reads its assigned Issues and checks the prerequisites recorded there.
# If any assigned Issue is blocked by an incomplete prerequisite Issue,
# the chat reports that dependency and does not invent alternate work.

version: 1

# S&T Planner owns this file only.
# A target repository may have its own root STATUS.yaml/phase/workstream state.
# Do not treat those as aliases or mutate them unless target-project rules explicitly require integration.

# Whole planning+execution cycle lifecycle:
# - active: the current scope is still being planned, handed off, executed, or verified
# - completed: execution and cycle-closure review proved the intended root outcome
# - abandoned: this cycle was intentionally closed without claiming the intended outcome succeeded
#
# Only one S&T cycle is active in a repository in V1.
# completed/abandoned are terminal for the current cycle and require implementation_authorized: false.
# A new cycle may start only after the prior terminal state and closure/abandonment review are durably recorded.
cycle_state: active

# Planning-baseline lifecycle only; deliberately separate from cycle_state.
plan_state: active

# Freeze and implementation authorization are deliberately separate.
# A frozen plan is still not executable until this becomes true.
# This must be false whenever cycle_state is completed or abandoned.
implementation_authorized: false

# Planning/resume pointer only. This is NOT the current executor node after freeze.
# Execution current/runnable work is derived from TREE.yaml -> depends_on plus
# EXECUTION.yaml states (see execution-guidance.mjs).
current_node: "0"

blockers: []

next_action: "Complete GOAL.md and continue building the S&T plan"

last_review: null

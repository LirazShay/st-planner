name: Framework tests

on:
  push:
    branches:
      - main
      - "pilot-*"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node --test tests/*.test.mjs
      - name: Verify framework release discipline
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/verify-release-discipline.mjs "$BASE_SHA"

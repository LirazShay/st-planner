version: 1

root: "0"

nodes:
  "0":
    status: approved
    strategy: "Users can import supported customer CSV files safely and predictably"
    tactic: "Process each upload through a bounded import workflow that interprets input, blocks invalid data, persists accepted records coherently, and reports a deterministic result"

    parallel_assumptions:
      - "The existing service can create customer records through reusable application logic"
      - "Authentication and authorization already exist and do not need to be redesigned for this change"

    necessary_assumptions: []

    sufficiency_assumptions:
      - "If supported input is interpreted consistently, invalid data is blocked before persistence, accepted data is persisted coherently, and the outcome is reported clearly, no additional import-specific capability is required for the stated goal"
      - "Existing authentication, service availability, and customer-domain rules are already-satisfied conditions rather than new import work"

    success_evidence:
      - "Valid supported files create expected records; invalid files create none; the caller receives a deterministic result"

    children:
      - "0.1"
      - "0.2"
      - "0.3"
      - "0.4"

  "0.1":
    status: approved
    strategy: "Supported CSV input is recognized and interpreted consistently"
    tactic: "Define one explicit import contract and parse uploads only according to that contract"

    parallel_assumptions:
      - "A single explicit contract prevents sessions or implementations from inventing different CSV interpretations"

    necessary_assumptions:
      - "Without deterministic interpretation, later validation and persistence cannot reliably know what data the user submitted"

    sufficiency_assumptions:
      - "An unambiguous contract plus a parser that applies it is sufficient to turn supported CSV text into structured candidate rows"

    success_evidence:
      - "The same supported file produces the same structured candidate rows and the same structural errors"

    children:
      - "0.1.1"
      - "0.1.2"

  "0.1.1":
    status: approved
    strategy: "The supported CSV shape is unambiguous"
    tactic: "Specify required and optional columns, data types, encoding expectations, structural limits, and structural error rules"

    parallel_assumptions:
      - "The parser cannot behave deterministically unless supported input is defined before parsing behavior is implemented"

    necessary_assumptions:
      - "Without an explicit contract, the parser has no stable definition of supported versus unsupported input"

    sufficiency_assumptions: []

    success_evidence:
      - "A reviewer can classify example files as supported or unsupported using the written contract alone"

    children: []

  "0.1.2":
    status: approved
    strategy: "Supported uploads are converted into structured candidate rows according to the contract"
    tactic: "Implement a CSV parser that applies the defined contract and returns structured rows plus structural errors"

    parallel_assumptions:
      - "The existing customer creation logic needs structured candidate data rather than raw CSV text"

    necessary_assumptions:
      - "A contract alone does not transform uploaded bytes into data the import workflow can validate and persist"

    sufficiency_assumptions: []

    success_evidence:
      - "Parser tests prove supported files become expected candidate rows and malformed files return structural errors"

    children: []

  "0.2":
    status: approved
    strategy: "Invalid or unsafe candidate data cannot reach customer persistence"
    tactic: "Apply an explicit admissibility policy to every candidate and enforce a persistence gate that accepts only candidates that pass it"

    parallel_assumptions:
      - "The existing customer-domain validation can be reused as part of the admissibility policy"
      - "Validation must be enforced at the persistence boundary; merely reporting validation errors would not protect the data"

    necessary_assumptions:
      - "Without a validation barrier, malformed or domain-invalid data could create invalid customer records"

    sufficiency_assumptions:
      - "If admissibility is explicitly defined, every candidate is checked against it, and persistence accepts only passing candidates, invalid or unsafe candidate data cannot reach customer persistence"

    success_evidence:
      - "Invalid candidate data produces no customer write"
      - "A bypass test cannot persist a candidate that has not passed the admissibility gate"

    children:
      - "0.2.1"
      - "0.2.2"
      - "0.2.3"

  "0.2.1":
    status: blocked
    strategy: "The import has an unambiguous definition of admissible customer data"
    tactic: "Define the import admissibility policy by combining existing customer-domain validation with explicit import-specific rules"

    parallel_assumptions:
      - "Existing domain validation should remain authoritative rather than being reimplemented for CSV import"
      - "Import-specific rules are needed only where the import introduces concerns not already expressed by the customer domain"

    necessary_assumptions:
      - "Without a defined admissibility policy, validation cannot consistently distinguish accepted from rejected candidate data"

    sufficiency_assumptions: []

    success_evidence:
      - "A reviewer can classify representative candidate rows as admissible or inadmissible from the policy alone"

    children: []

  "0.2.2":
    status: draft
    strategy: "Every candidate receives an admissibility result before persistence"
    tactic: "Evaluate each structured candidate against the approved admissibility policy and retain its validation outcome"

    parallel_assumptions:
      - "Candidate-level evaluation is required because a structurally valid CSV row can still violate customer-domain or import-specific rules"

    necessary_assumptions:
      - "A written policy alone does not determine whether a specific candidate passes or fails"

    sufficiency_assumptions: []

    success_evidence:
      - "Tests show every candidate has a deterministic pass/fail result and validation errors where applicable"

    children: []

  "0.2.3":
    status: draft
    strategy: "A candidate that failed admissibility cannot be written as a customer"
    tactic: "Enforce a persistence gate that accepts only candidates with a passing admissibility result"

    parallel_assumptions:
      - "Validation that can be bypassed or ignored is insufficient to protect customer persistence"

    necessary_assumptions:
      - "Even correctly evaluated candidates could still be persisted if the write path does not enforce the validation result"

    sufficiency_assumptions: []

    success_evidence:
      - "Persistence-boundary tests prove rejected or unevaluated candidates cannot create customer records"

    children: []

  "0.3":
    status: draft
    strategy: "Accepted import data is persisted without an ambiguous partial outcome"
    tactic: "TBD"

    parallel_assumptions: []
    necessary_assumptions:
      - "Interpreting and validating data is insufficient unless accepted records are actually committed with a defined failure policy"
    sufficiency_assumptions: []
    success_evidence:
      - "Persistence tests demonstrate the selected batch/failure semantics"
    children: []

  "0.4":
    status: draft
    strategy: "The caller can determine what the import did"
    tactic: "TBD"

    parallel_assumptions: []
    necessary_assumptions:
      - "A user cannot rely on an import whose accepted, rejected, or failed outcome is opaque"
    sufficiency_assumptions: []
    success_evidence:
      - "The response identifies the overall result and row-level outcome required by the agreed contract"
    children: []

